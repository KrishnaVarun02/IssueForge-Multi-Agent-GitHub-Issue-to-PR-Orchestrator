name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python source
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Run security invariants
        run: python -m multi_agent_system.security_audit

      - name: Run unit and integration tests
        run: python -m pytest -q

  docker-sandbox:
    name: Docker sandbox image
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Build sandbox image
        run: >-
          docker build
          --file docker/Dockerfile.sandbox
          --tag multi-agent-test-sandbox:ci
          .

      - name: Verify sandbox entrypoint
        run: docker run --rm multi-agent-test-sandbox:ci --version
